spring:
  datasource:
    url: jdbc:h2:mem:atelier_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
  razorpay:
    simulation-enabled: true
    key-id: DEMO_ONLY
    key-secret: atelier_dev_only_signature_secret
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins:
      - http://localhost:8000
      - http://127.0.0.1:8000
      - http://localhost:3000
      - http://localhost:5173
