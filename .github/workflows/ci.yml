name: Atelier Watch CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-check:
    name: Frontend Syntax & Asset Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: node -c app.js js/api.js js/ui.js

      - name: Verify Animation Frame Sequence
        run: |
          count=$(ls -1 assets/frames/*.webp | wc -l)
          if [ "$count" -ne 240 ]; then
            echo "Error: Expected 240 animation frames, found $count"
            exit 1
          fi
          echo "Verified $count animation frames present."

  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw

      - name: Run Spring Boot Tests with Maven Wrapper
        working-directory: backend
        run: ./mvnw clean test -B
